server:
  port: 8080

spring:
  application:
    name: crix-cricket-data-service
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 200
          max-idle: 50
          min-idle: 10

sportmonks:
  base-url: https://cricket.sportmonks.com/api/v2.0
  api-token: ${SPORTMONKS_API_TOKEN:}

logging:
  level:
    com.cricketlive.crixworld: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Crixworld Cricket API
    description: Live cricket scores and fixture details
    version: 0.0.1-SNAPSHOT